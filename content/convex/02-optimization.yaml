- id: cvx.projected-gd
  kind: definition
  subject: convex
  title: 射影と射影勾配法
  requires: [cvx.convex-set, cvx.smooth]
  source: Boyd & Vandenberghe, Ch.8.1
  statement: |-
    閉凸集合 $C$ への**射影** $P_C(x) = \arg\min_{z \in C}\|z - x\|$ はただ1つに定まり、次で特徴づけられる:
    $$(x - P_C(x))^\top(z - P_C(x)) \le 0 \quad (\forall z \in C).$$
    射影は距離を縮める（$\|P_C(x) - P_C(y)\| \le \|x - y\|$）。
    **射影勾配法**: $x_{k+1} = P_C(x_k - \eta\nabla f(x_k))$。制約が「射影しやすい集合」（箱・球・半空間・単体）なら、制約なしの勾配法とほぼ同じ手間で解ける。
  questions:
    - q: |-
        箱 $\{x : l \le x \le u\}$ への射影はどう計算するか？
      a: |-
        成分ごとに $\min(\max(x_i, l_i), u_i)$（はみ出した成分を切り詰める）。

