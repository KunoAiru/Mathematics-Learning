- id: cvx.kkt
  kind: theorem
  subject: convex
  title: KKT 条件
  requires: [cvx.lagrange, cvx.weak-duality]
  source: Boyd & Vandenberghe, Ch.5.5
  why: |-
    不等式制約付き最適化の最適性条件。サポートベクターマシン、制御の最適化、資源配分の問題で、解の形を導くのに使う。
  statement: |-
    問題 $\min f_0(x)$ s.t. $f_i(x) \le 0$, $h_j(x) = 0$ について、次を **KKT 条件**という:
    1. 主実行可能性: $f_i(x^*) \le 0$, $h_j(x^*) = 0$
    2. 双対実行可能性: $\lambda_i^* \ge 0$
    3. **相補性**: $\lambda_i^* f_i(x^*) = 0$
    4. 停留性: $\nabla f_0(x^*) + \sum_i \lambda_i^* \nabla f_i(x^*) + \sum_j \nu_j^* \nabla h_j(x^*) = 0$

    凸問題（$f_0, f_i$ が凸、$h_j$ がアフィン）でスレーター条件が成り立てば、KKT 条件は最適性の**必要十分条件**。
  questions:
    - q: |-
        相補性 $\lambda_i f_i(x^*) = 0$ は何を意味するか？
      a: |-
        各制約について「効いていない（$f_i < 0$）なら乗数は $0$」か「乗数が正なら制約はぴったり効いている（$f_i = 0$）」のどちらか。SVM では乗数が正の点だけがサポートベクトルになる。

- id: cvx.strong-duality
  kind: theorem
  subject: convex
  title: 強双対性とスレーター条件
  requires: [cvx.kkt]
  source: Boyd & Vandenberghe, Ch.5.2–5.3
  statement: |-
    凸問題 $\min f_0(x)$ s.t. $f_i(x) \le 0$, $Ax = b$ において、**スレーター条件**（すべての $f_i(x) < 0$ を厳密に満たし $Ax = b$ を満たす点が存在する）が成り立てば、
    $$d^* = \max_{\lambda \ge 0, \nu} g(\lambda, \nu) = p^*$$
    （双対ギャップが $0$）。弱双対性 $d^* \le p^*$ は常に成り立つが、等号には条件が要る。
  questions:
    - q: |-
        強双対性がアルゴリズムで役に立つ理由は？
      a: |-
        実行可能解 $x$ と双対実行可能解 $(\lambda, \nu)$ があれば、$f_0(x) - g(\lambda, \nu)$ が最適値までの誤差の上界になる（双対ギャップ）。これを停止条件にでき、「最適から $\varepsilon$ 以内」と証明付きで言える。
    - q: |-
        凸でない問題では強双対性はどうなるか？
      a: |-
        一般に成り立たず、$d^* < p^*$ となりうる。それでも双対問題は凸なので解きやすく、$d^*$ は元の問題の下界として分枝限定法などに使われる。

- id: cvx.lp
  kind: definition
  subject: convex
  title: 線形計画法
  requires: [cvx.convex-set]
  source: Boyd & Vandenberghe, Ch.4.3
  statement: |-
    目的関数も制約も線形（アフィン）な最適化問題:
    $$\min\ c^\top x \quad \text{s.t.}\ Ax \le b,\ x \ge 0.$$
    実行可能領域は凸多面体で、最適値が有限ならある**頂点**で最適値がとられる。
    - **単体法**: 頂点から隣の頂点へ、目的関数が良くなる方向にたどる。実用上は速い
    - **内点法**: 領域の内部から近づく。最悪でも多項式時間
    LP の双対問題もまた LP で、条件が整えば強双対性が成り立つ。
  questions:
    - q: |-
        変数が整数に限られる問題（整数計画）は LP より難しいのはなぜか？
      a: |-
        実行可能領域が凸でなく（格子点の集合）、頂点で最適という性質も使えない。一般に NP 困難。LP 緩和（整数制約を外した LP）の値を下界にして分枝限定法で解く。

