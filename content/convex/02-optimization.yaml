- id: cvx.smooth
  kind: definition
  subject: convex
  title: L-平滑性と降下補題
  requires: [cvx.first-order, la.cauchy-schwarz]
  source: Boyd & Vandenberghe, Ch.9.1
  statement: |-
    微分可能な $f$ が **$L$-平滑**であるとは、勾配がリプシッツ連続 $\|\nabla f(x) - \nabla f(y)\| \le L\|x - y\|$ であること（2回微分可能なら $\nabla^2 f \preceq LI$）。
    **降下補題**: $L$-平滑なら
    $$f(y) \le f(x) + \nabla f(x)^\top(y - x) + \frac{L}{2}\|y - x\|^2.$$
    特に $y = x - \frac{1}{L}\nabla f(x)$ とすると $f(y) \le f(x) - \frac{1}{2L}\|\nabla f(x)\|^2$（1ステップで必ず減る量）。
  questions:
    - q: |-
        2次関数 $f(x) = \frac12 x^\top A x$（$A$ 対称）の $L$ は何か？
      a: |-
        $A$ の固有値の絶対値の最大値（$A \succeq 0$ なら最大固有値）。$\nabla f(x) = Ax$ で、$\|Ax - Ay\| \le \lambda_{\max}\|x - y\|$。

- id: cvx.gd-convergence
  kind: theorem
  subject: convex
  title: 勾配降下法の収束レート
  requires: [cvx.smooth]
  source: Boyd & Vandenberghe, Ch.9.3
  why: |-
    「何回反復すれば誤差が $\varepsilon$ 以下になるか」を保証する。学習率の選び方や、なぜ問題によって収束が遅いのかの説明の土台。
  statement: |-
    $f$ が凸で $L$-平滑、最小点 $x^*$ をもつとき、ステップ幅 $\eta = 1/L$ の勾配降下法 $x_{k+1} = x_k - \frac{1}{L}\nabla f(x_k)$ は
    $$f(x_k) - f(x^*) \le \frac{L\|x_0 - x^*\|^2}{2k}.$$
    つまり誤差 $\varepsilon$ には $O(1/\varepsilon)$ 回の反復で十分。
  proof:
    - |-
      降下補題より $f(x_{k+1}) \le f(x_k) - \frac{1}{2L}\|\nabla f(x_k)\|^2$。特に $f(x_k)$ は単調減少。
    - |-
      凸性（1次条件）より $f(x_k) \le f(x^*) + \nabla f(x_k)^\top(x_k - x^*)$。
    - |-
      2つを合わせ、$x_{k+1} - x^* = x_k - x^* - \frac1L\nabla f(x_k)$ を展開すると $f(x_{k+1}) - f(x^*) \le \frac{L}{2}\left(\|x_k - x^*\|^2 - \|x_{k+1} - x^*\|^2\right)$。
    - |-
      $k = 0, \dots, K-1$ で足すと右辺は打ち消し合い（望遠鏡和）、$\sum_{k=1}^{K}(f(x_k) - f(x^*)) \le \frac{L}{2}\|x_0 - x^*\|^2$。
    - |-
      $f(x_k)$ は単調減少なので、左辺は $K(f(x_K) - f(x^*))$ 以上。$K$ で割って結論を得る。
  questions:
    - q: |-
        さらに $f$ が $\mu$-強凸なら、収束はどう速くなるか？
      a: |-
        線形収束（指数的）: $f(x_k) - f^* \le (1 - \mu/L)^k (f(x_0) - f^*)$。条件数 $\kappa = L/\mu$ が大きい（谷が細長い）ほど遅い。
    - q: |-
        ステップ幅を $2/L$ より大きくすると何が起こりうるか？
      a: |-
        発散しうる。$f(x) = \frac{L}{2}x^2$ なら $x_{k+1} = (1 - \eta L)x_k$ で、$|1 - \eta L| > 1$ になり振動しながら大きくなる。

- id: cvx.strong-convexity
  kind: definition
  subject: convex
  title: 強凸性と条件数
  requires: [cvx.smooth]
  source: Boyd & Vandenberghe, Ch.9.1
  statement: |-
    $f$ が **$\mu$-強凸**（$\mu > 0$）であるとは、$f(x) - \frac{\mu}{2}\|x\|^2$ が凸であること。2回微分可能なら $\nabla^2 f \succeq \mu I$。
    強凸関数は最小点をただ1つもち、$f(x) - f^* \ge \frac{\mu}{2}\|x - x^*\|^2$（関数値が小さければ点も近い）。
    $L$-平滑かつ $\mu$-強凸のとき、**条件数** $\kappa = L/\mu$ が勾配法の難しさを決める。
  questions:
    - q: |-
        リッジ回帰 $\|Xw - y\|^2 + \lambda\|w\|^2$ が常に解を一つだけもつ理由を強凸性で説明せよ。
      a: |-
        $\lambda\|w\|^2$ の項でヘッセ行列が $2(X^\top X + \lambda I) \succeq 2\lambda I$ となり、$2\lambda$-強凸になる。強凸関数の最小点は一意。多重共線性があっても解が定まる。

- id: cvx.newton
  kind: definition
  subject: convex
  title: ニュートン法
  requires: [cvx.strong-convexity]
  source: Boyd & Vandenberghe, Ch.9.5
  statement: |-
    各点で2次近似 $f(x) + \nabla f(x)^\top d + \frac12 d^\top \nabla^2 f(x) d$ を最小にする方向に進む:
    $$x_{k+1} = x_k - \left[\nabla^2 f(x_k)\right]^{-1}\nabla f(x_k).$$
    - 最適解の近くでは**2次収束**（正しい桁数が毎回ほぼ倍になる）
    - 1回の反復で $n \times n$ の連立方程式を解く（$O(n^3)$）。変数が多いと重い
    - 遠くからは発散しうるので、直線探索（ステップ幅を減らす）と組み合わせる
    - アフィン変換で問題を変形しても挙動が変わらない（条件数の影響を受けにくい）
  questions:
    - q: |-
        変数が数百万あるニューラルネットの学習でニュートン法がそのまま使われない理由は？
      a: |-
        ヘッセ行列が $n^2$ 個の要素をもち、保存も逆行列の計算もできない。準ニュートン法（L-BFGS）や、勾配のみの手法（Adam など）が使われる。

