# 凸解析・最適化 2: 凸性の判定・双対性・KKT・アルゴリズムの収束
# 出典の章番号は Boyd & Vandenberghe, Convex Optimization（著者が無料公開）

- id: cvx.convex-ops
  kind: definition
  subject: convex
  title: 凸性を保つ操作
  requires: [cvx.convex-function]
  source: Boyd & Vandenberghe, Ch.3.2
  why: |-
    実際の問題では定義から凸性を確かめるのは大変。凸と分かっている部品をこれらの操作で組み立てて凸性を示すのが実践的な方法（CVXPY などはこの規則で自動判定する）。
  statement: |-
    $f, g$ が凸なら、次も凸:
    1. 非負の重み付き和 $\alpha f + \beta g$（$\alpha, \beta \ge 0$）
    2. アフィン写像との合成 $f(Ax + b)$
    3. 各点ごとの最大 $\max\{f(x), g(x)\}$（一般に、凸関数の族の上限）
    4. $h$ が凸で非減少、$f$ が凸なら $h(f(x))$

    代表的な凸関数: ノルム $\|x\|$、$\max_i x_i$、$\log\sum_i e^{x_i}$（log-sum-exp）、$x^\top P x$（$P \succeq 0$）、$-\log x$。
  questions:
    - q: |-
        $f(x) = \|Ax - b\|_2 + \lambda\|x\|_1$（$\lambda \ge 0$）が凸であることを示せ。
      a: |-
        $\|\cdot\|_2$ はノルムなので凸、それとアフィン写像 $Ax - b$ の合成は凸。$\|x\|_1$ も凸で、非負の重み $\lambda$ を掛けて足しても凸（LASSO の目的関数）。
    - q: |-
        2つの凸関数の積や、最小 $\min\{f, g\}$ は凸か？
      a: |-
        一般に凸でない。$\min\{x^2, (x - 2)^2\}$ は谷が2つあり凸でない。$x \cdot x^2 = x^3$ も凸でない。

- id: cvx.jensen
  kind: theorem
  subject: convex
  title: イェンセンの不等式
  requires: [cvx.first-order, prob.expectation]
  source: Boyd & Vandenberghe, Ch.3.1.8
  why: |-
    情報理論（KL ダイバージェンスが非負）、EM アルゴリズム、機械学習の変分推論、相加相乗平均など、多くの不等式の源。
  statement: |-
    $f$ が凸関数で、確率変数 $X$ と $f(X)$ の期待値が存在するとき
    $$f(E[X]) \le E[f(X)].$$
    $f$ が凹なら不等号は逆になる。
  proof:
    - |-
      $\mu = E[X]$ とおく。（微分可能な場合）凸関数の1次条件より、すべての $x$ で $f(x) \ge f(\mu) + \nabla f(\mu)^\top (x - \mu)$。
    - |-
      $x = X$ を代入して両辺の期待値をとる: $E[f(X)] \ge f(\mu) + \nabla f(\mu)^\top (E[X] - \mu)$。
    - |-
      $E[X] - \mu = 0$ なので $E[f(X)] \ge f(\mu) = f(E[X])$。
  questions:
    - q: |-
        イェンセンの不等式から相加相乗平均の不等式 $\sqrt{ab} \le (a + b)/2$（$a, b > 0$）を導け。
      a: |-
        $\log$ は凹。$X$ が $a, b$ を確率 $1/2$ ずつとるとすると $\log E[X] \ge E[\log X]$、つまり $\log\frac{a + b}{2} \ge \frac{\log a + \log b}{2} = \log\sqrt{ab}$。
    - q: |-
        $E[X^2] \ge (E[X])^2$ はこの不等式のどんな特別な場合か？
      a: |-
        $f(x) = x^2$（凸）の場合。差 $E[X^2] - (E[X])^2$ は分散で、非負であることと同じ。

- id: cvx.lagrange
  kind: theorem
  subject: convex
  title: ラグランジュの未定乗数法
  requires: [cvx.first-order, la.rank-nullity]
  source: Boyd & Vandenberghe, Ch.5.1
  statement: |-
    $f, h_1, \dots, h_p$ が微分可能で、$x^*$ が $h_j(x) = 0$（$j = 1, \dots, p$）のもとでの $f$ の局所最小点、かつ $\nabla h_1(x^*), \dots, \nabla h_p(x^*)$ が1次独立ならば、
    $$\nabla f(x^*) + \sum_{j=1}^p \nu_j \nabla h_j(x^*) = 0$$
    を満たす $\nu_1, \dots, \nu_p$（ラグランジュ乗数）が存在する。
    幾何的には「制約面に沿ったどの方向に動いても $f$ が1次では変化しない」= 勾配が制約面に垂直。
  questions:
    - q: |-
        ラグランジュ乗数 $\nu_j$ には何という意味があるか？
      a: |-
        制約の右辺を少し動かしたときの最適値の変化率（感度・シャドープライス）。$h_j(x) = \varepsilon$ にすると最適値はおよそ $-\nu_j \varepsilon$ 変わる（符号は $L$ の定め方による）。
    - q: |-
        この条件は最小点であるための十分条件か？
      a: |-
        一般には必要条件にすぎない（最大点や鞍点でも満たされる）。目的関数が凸で制約がアフィンなら十分条件にもなる。

