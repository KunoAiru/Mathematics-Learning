- id: cvx.sgd
  kind: definition
  subject: convex
  title: 確率的勾配降下法（SGD）
  requires: [cvx.gd-convergence, prob.linearity]
  source: Boyd & Vandenberghe（関連 Ch.9）, 機械学習の標準的な手法
  statement: |-
    目的関数がデータの平均 $f(x) = \frac1N\sum_{i=1}^N f_i(x)$ のとき、毎回ランダムに選んだ $i$（または少数のミニバッチ）の勾配 $\nabla f_i(x)$ で更新する:
    $$x_{k+1} = x_k - \eta_k \nabla f_{i_k}(x_k).$$
    $E[\nabla f_{i_k}(x)] = \nabla f(x)$（不偏）なので平均的には正しい方向に進むが、ノイズがあるため、収束させるにはステップ幅を徐々に小さくする（例: $\eta_k \propto 1/\sqrt{k}$）。1回の更新が $N$ に依存しないので大規模データで有利。
  questions:
    - q: |-
        ミニバッチの大きさを $B$ 倍にすると、勾配のばらつき（分散）はどうなるか？
      a: |-
        独立に選ぶなら平均の分散は $1/B$ 倍（標準偏差は $1/\sqrt{B}$ 倍）。ただし計算量は $B$ 倍なので、大きくしすぎると効率が落ちる。
