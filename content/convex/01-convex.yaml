- id: cvx.weak-duality
  kind: theorem
  subject: convex
  title: 弱双対性
  requires: [cvx.first-order]
  source: Boyd & Vandenberghe, Ch.5
  why: |-
    双対問題の値は、元の問題の最適値の「下界（保証）」になる。最適化ソルバーが「これ以上良い解はない」と証明できる仕組みであり、SVM や制約付き最適化の理論の柱。
  statement: |-
    問題 $\min f_0(x)$ s.t. $f_i(x) \le 0$ ($i = 1, \dots, m$), $h_j(x) = 0$ の最適値を $p^*$ とする。ラグランジュ関数
    $$L(x, \lambda, \nu) = f_0(x) + \sum_i \lambda_i f_i(x) + \sum_j \nu_j h_j(x)$$
    と双対関数 $g(\lambda, \nu) = \inf_x L(x, \lambda, \nu)$ について、$\lambda \ge 0$ ならば $g(\lambda, \nu) \le p^*$。
    （凸性は不要。）
  proof:
    - |-
      実行可能な $\tilde{x}$（$f_i(\tilde x) \le 0$, $h_j(\tilde x) = 0$）を任意にとる。
    - |-
      $\lambda_i \ge 0$, $f_i(\tilde{x}) \le 0$ より $\sum_i \lambda_i f_i(\tilde{x}) \le 0$。また $\sum_j \nu_j h_j(\tilde x) = 0$。
    - |-
      よって $L(\tilde{x}, \lambda, \nu) \le f_0(\tilde{x})$。
    - |-
      $g(\lambda, \nu) = \inf_x L(x, \lambda, \nu) \le L(\tilde x, \lambda, \nu) \le f_0(\tilde{x})$。
    - |-
      実行可能な $\tilde{x}$ について下限をとれば $g(\lambda, \nu) \le p^*$。
  questions:
    - q: |-
        $\lambda \ge 0$ の仮定を外すと何が起こるか？反例を挙げよ。
      a: |-
        成り立たない。$\min x^2$ s.t. $x - 1 \le 0$ の最適値は $p^* = 0$。$L = x^2 + \lambda(x - 1)$ より $g(\lambda) = -\lambda^2/4 - \lambda$。$\lambda = -2$ では $g = 1 > p^*$。
    - q: |-
        強双対性 $\max g = p^*$ が成り立つための代表的な十分条件は？
      a: |-
        凸問題でスレーター条件（$f_i(x) < 0$ を厳密に満たす実行可能点が存在する）が成り立つこと。
