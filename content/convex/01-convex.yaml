# 凸解析・最適化
# 出典の章番号は Boyd & Vandenberghe, Convex Optimization（著者が無料公開）

- id: cvx.convex-set
  kind: definition
  subject: convex
  title: 凸集合
  requires: [la.vector-space]
  source: Boyd & Vandenberghe, Ch.2
  statement: |-
    $C \subseteq \mathbb{R}^n$ が**凸集合**であるとは、任意の $x, y \in C$ と $\theta \in [0, 1]$ について
    $$\theta x + (1 - \theta) y \in C$$
    が成り立つこと（2点を結ぶ線分が $C$ に含まれる）。
  questions:
    - q: |-
        2つの凸集合の共通部分は凸か？和集合は？
      a: |-
        共通部分は凸（線分が両方に含まれるので）。和集合は一般に凸でない（離れた2つの円板など）。線形不等式 $Ax \le b$ の解集合が凸なのは、半空間の共通部分だから。

- id: cvx.convex-function
  kind: definition
  subject: convex
  title: 凸関数
  requires: [cvx.convex-set]
  source: Boyd & Vandenberghe, Ch.3
  why: |-
    凸関数の最小化は「局所解 = 大域解」になり、確実に解ける。機械学習の損失関数、制御のコスト関数、回路設計の多くは凸に定式化することで信頼できる解法が使える。
  statement: |-
    凸集合 $D$ 上の関数 $f: D \to \mathbb{R}$ が**凸**であるとは、任意の $x, y \in D$, $\theta \in [0, 1]$ について
    $$f(\theta x + (1 - \theta) y) \le \theta f(x) + (1 - \theta) f(y)$$
    が成り立つこと（グラフの弦がグラフより上にある）。2回微分可能なら、$f$ が凸 $\iff$ ヘッセ行列 $\nabla^2 f(x)$ がすべての $x$ で半正定値。
  questions:
    - q: |-
        $f(x, y) = x^2 + xy + y^2$ は凸か？ヘッセ行列で判定せよ。
      a: |-
        凸。$\nabla^2 f = \begin{pmatrix} 2 & 1 \\ 1 & 2 \end{pmatrix}$ の固有値は $1, 3$ でともに正なので正定値（狭義凸）。
    - q: |-
        $f(x) = x^3$ は $\mathbb{R}$ 上で凸か？
      a: |-
        凸でない。$f''(x) = 6x$ は $x < 0$ で負。$[0, \infty)$ に制限すれば凸。

- id: cvx.first-order
  kind: theorem
  subject: convex
  title: 凸関数の1次条件
  requires: [cvx.convex-function]
  source: Boyd & Vandenberghe, Ch.3
  statement: |-
    $f$ が微分可能で定義域 $D$ が開凸集合のとき、
    $$f \text{ が凸} \iff f(y) \ge f(x) + \nabla f(x)^\top (y - x) \quad (\forall x, y \in D).$$
    つまり接平面はつねにグラフの下にある。特に $\nabla f(x^*) = 0$ ならば $x^*$ は大域最小点。
  proof:
    - |-
      (⇒) 凸性より $0 < t \le 1$ で $f(x + t(y - x)) \le (1 - t) f(x) + t f(y)$。
    - |-
      移項して $t$ で割ると $f(y) \ge f(x) + \dfrac{f(x + t(y - x)) - f(x)}{t}$。
    - |-
      $t \to 0^+$ とすると、右辺の差分商は方向微分 $\nabla f(x)^\top (y - x)$ に収束する。
    - |-
      (⇐) $z = \theta x + (1 - \theta) y$ とおき、不等式を点 $z$ で $x$ と $y$ に対して使う: $f(x) \ge f(z) + \nabla f(z)^\top (x - z)$, $f(y) \ge f(z) + \nabla f(z)^\top (y - z)$。
    - |-
      それぞれ $\theta$, $1 - \theta$ 倍して足すと、$\theta(x - z) + (1 - \theta)(y - z) = 0$ より $\theta f(x) + (1 - \theta) f(y) \ge f(z)$。
  questions:
    - q: |-
        凸でない関数で $\nabla f(x^*) = 0$ でも最小点でない例を挙げよ。
      a: |-
        $f(x) = x^3$ の $x = 0$（停留点だが最小でも極小でもない）や、$f(x, y) = x^2 - y^2$ の原点（鞍点）。ニューラルネットの学習で勾配が $0$ でも安心できない理由。

