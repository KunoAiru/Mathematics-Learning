# Rust 0: 基本構文
# 出典: The Rust Programming Language（以下 TRPL, 無料公開）

- id: rust.hello
  kind: definition
  subject: rust
  title: Cargo とプログラムの構造
  requires: []
  source: TRPL Ch.1
  statement: |-
    ```
    cargo new hello      # プロジェクトを作る（src/main.rs と Cargo.toml）
    cargo run            # ビルドして実行
    cargo build --release
    cargo test           # テストを実行
    cargo clippy         # よくある間違いを指摘するリンター
    cargo fmt            # 整形
    ```
    ```
    fn main() {
        let name = "Rust";
        println!("Hello, {}!", name);        // {} は Display で表示
        println!("{:?} {:.3}", (1, 2), 3.14159); // {:?} は Debug、{:.3} は小数3桁
    }
    ```
    `println!` の `!` はマクロであることを表す。
  questions:
    - q: |-
        `cargo build` と `cargo build --release` の違いは？
      a: |-
        既定（debug）は最適化なしでコンパイルが速く、整数オーバーフロー検査などが有効。`--release` は最適化して速いが、オーバーフローは検査せず回り込む。性能を測るときは必ず release で。

- id: rust.variables
  kind: definition
  subject: rust
  title: 変数・可変性・基本型
  requires: [rust.hello]
  source: TRPL Ch.3.1–3.2
  statement: |-
    - `let x = 5;` は**既定で不変**。変更するなら `let mut x = 5;`
    - 同じ名前で `let` し直すと前の変数を隠す（**シャドーイング**）。型を変えてもよい
    - 整数 `i8`〜`i128`, `u8`〜`u128`, `isize`/`usize`（添字・長さ用）、浮動小数 `f32`/`f64`、`bool`、`char`（4バイトの Unicode スカラー値）
    - タプル `(i32, f64)`、配列 `[i32; 3]`（長さ固定）
    - 型は推論されるが、必要なら `let x: u64 = 10;` と注釈する
    - 型の変換は暗黙には起きない。`as` か `From`/`TryFrom` で明示する
  questions:
    - q: |-
        `let mut x` で値を変えることと、シャドーイング `let x = ...` の違いは？
      a: |-
        `mut` は同じ変数の値を書き換え、型は変えられない。シャドーイングは新しい変数を作るので型を変えられ、元の変数はそれ以降見えなくなるだけ（元の値は変わらない）。

- id: rust.shadowing
  kind: code
  subject: rust
  title: シャドーイングとスコープ
  requires: [rust.variables]
  source: TRPL Ch.3.1
  lang: rust
  code: |
    fn main() {
        let x = 5;
        let x = x * 2;
        {
            let x = x + 1;
            print!("{} ", x);
        }
        println!("{}", x);
    }
  prompt: |-
    出力は何か？
  answer:
    type: choice
    choices:
      - "11 11"
      - "11 10"
      - "6 5"
      - コンパイルエラー（x は不変）
    value: 1
  explanation: |-
    2行目で新しい `x`（$10$）が前の `x` を隠す。内側のブロックの `x`（$11$）はブロックの中だけ有効で、抜けると外側の `x`（$10$）が再び見える。どれも書き換えではないので `mut` は不要。
  verify:
    stdout: "11 10\n"

- id: rust.mut-error
  kind: code
  subject: rust
  title: 不変な変数への再代入
  requires: [rust.variables]
  source: TRPL Ch.3.1
  lang: rust
  code: |
    fn main() {
        let count = 0;
        count += 1;
        println!("{}", count);
    }
  prompt: |-
    このプログラムはどうなるか？
  answer:
    type: choice
    choices:
      - "1 と出力される"
      - "0 と出力される"
      - コンパイルエラー
    value: 2
  explanation: |-
    `count` は `mut` なしで宣言されているので代入できず、エラー E0384（cannot assign twice to immutable variable）。コンパイラは `let mut count` にするよう提案してくれる。
    既定が不変なので、「どこで値が変わりうるか」が `mut` を探すだけで分かる。
  verify:
    build: error

- id: rust.casting
  kind: code
  subject: rust
  title: as による数値変換
  requires: [rust.variables]
  source: The Rust Reference "Type cast expressions"
  lang: rust
  code: |
    fn main() {
        let a = 300i32 as u8;
        let b = -1i32 as u32;
        let c = -3.99f64 as i32;
        let d = 1e10f64 as i32;
        println!("{} {} {} {}", a, b, c, d);
    }
  prompt: |-
    出力は何か？
  answer:
    type: choice
    choices:
      - "44 4294967295 -3 2147483647"
      - "255 0 -4 2147483647"
      - "44 4294967295 -4 -2147483648"
      - コンパイルエラー（範囲外の変換）
    value: 0
  explanation: |-
    整数どうしの `as` は下位ビットを残して切り詰める（$300 \bmod 256 = 44$、$-1$ は全ビット 1 なので $2^{32} - 1$）。浮動小数から整数へは 0 方向に切り捨て（$-3$）、範囲外なら**飽和**する（`i32::MAX`）。NaN は 0 になる。
    黙って値が変わるのが危ないときは `u8::try_from(300)`（`Result` を返す）を使う。
  verify:
    stdout: "44 4294967295 -3 2147483647\n"

- id: rust.expressions
  kind: definition
  subject: rust
  title: 式と文・ブロックの値
  requires: [rust.variables]
  source: TRPL Ch.3.3
  statement: |-
    Rust ではほとんどのものが**式**で、値を持つ。
    - ブロック `{ ... }` の値は、最後の**セミコロンのない式**の値。セミコロンを付けると文になり、値は `()`（ユニット）
    - `if` も式: `let y = if x > 0 { 1 } else { -1 };`
    - 関数は最後の式の値を返す（`return` は途中で抜けるときに使う）
    ```
    fn square(x: i32) -> i32 {
        x * x        // セミコロンなし = 戻り値
    }
    ```
  questions:
    - q: |-
        `let y = if c { 1 } else { "one" };` はなぜエラーか？
      a: |-
        `if` 式の各分岐は同じ型でなければならない（`i32` と `&str` で一致しない）。式なので静的な型が1つに決まる必要がある。

- id: rust.semicolon
  kind: code
  subject: rust
  title: 最後のセミコロン
  requires: [rust.expressions]
  source: TRPL Ch.3.3
  lang: rust
  code: |
    fn square(x: i32) -> i32 {
        x * x;
    }

    fn main() {
        println!("{}", square(3));
    }
  prompt: |-
    このプログラムはどうなるか？
  answer:
    type: choice
    choices:
      - "9 と出力される"
      - "0 と出力される"
      - コンパイルエラー（型の不一致）
    value: 2
  explanation: |-
    `x * x;` はセミコロンで文になり、関数本体の値は `()` になる。戻り値の型 `i32` と合わずエラー E0308。コンパイラは「セミコロンを取り除け」と提案する。
  verify:
    build: error

- id: rust.control-flow
  kind: definition
  subject: rust
  title: 制御構文（if・loop・while・for）
  requires: [rust.expressions]
  source: TRPL Ch.3.5
  statement: |-
    ```
    if n % 2 == 0 { ... } else { ... }   // 条件は bool のみ（整数は不可）、括弧不要
    let r = loop { ...; break 値; };      // loop は break で値を返せる
    while cond { ... }
    for i in 0..n { ... }                 // 0, 1, ..., n-1
    for i in (0..=n).rev() { ... }        // n, ..., 0
    for (i, x) in v.iter().enumerate() { ... }
    'outer: for ... { for ... { break 'outer; } }   // ラベル付き break
    ```
  questions:
    - q: |-
        C の `for (i = 0; i < n; i++)` 型のループがない利点は？
      a: |-
        範囲やイテレータを回すので、添字の更新忘れや範囲外アクセスが起きにくい。`v.iter()` で回せば境界検査も最適化で消える。

- id: rust.loop-value
  kind: code
  subject: rust
  title: loop の値と範囲の和
  requires: [rust.control-flow]
  source: TRPL Ch.3.5
  lang: rust
  code: |
    fn main() {
        let mut n = 1;
        let r = loop {
            n *= 3;
            if n > 50 {
                break n;
            }
        };
        let s: i32 = (1..=4).sum();
        let t: i32 = (1..4).sum();
        println!("{} {} {}", r, s, t);
    }
  prompt: |-
    出力は何か？
  answer:
    type: choice
    choices:
      - "81 10 6"
      - "27 10 10"
      - "81 10 10"
      - "243 6 10"
    value: 0
  explanation: |-
    $n = 3, 9, 27, 81$ で初めて $50$ を超え、`break n` で $81$ が `r` になる。`1..=4` は $4$ を含み和は $10$、`1..4` は含まず $6$。
  verify:
    stdout: "81 10 6\n"

- id: rust.functions
  kind: definition
  subject: rust
  title: 関数
  requires: [rust.expressions]
  source: TRPL Ch.3.3
  statement: |-
    ```
    fn div_mod(a: u32, b: u32) -> (u32, u32) {
        (a / b, a % b)
    }
    let (q, r) = div_mod(17, 5);
    ```
    - 引数と戻り値の型は**必ず書く**（関数の内側だけで型推論する。シグネチャが契約になる）
    - オーバーロードと既定引数はない。名前を分けるか、ジェネリクス・トレイト・ビルダーパターンで表す
    - 戻り値がないときは `()`。決して戻らない関数は `-> !`（`panic!` や無限ループ）
  questions:
    - q: |-
        シグネチャの型を省略できない設計の利点は？
      a: |-
        関数の中身を変えても外から見える型が変わらないので、変更の影響が関数内に閉じる。エラーメッセージもシグネチャを基準に出るので分かりやすい。
