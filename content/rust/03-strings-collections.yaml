# Rust 3: 文字列・スライス・コレクション
# 出典: TRPL（無料公開）, std ドキュメント

- id: rust.slices
  kind: definition
  subject: rust
  title: スライス
  requires: [rust.borrow]
  source: TRPL Ch.4.3
  statement: |-
    スライス `&[T]` は配列や `Vec<T>` の連続した一部への参照（先頭ポインタと長さ）。`&v[1..3]` のように範囲で作る。
    関数の引数を `&Vec<T>` ではなく `&[T]` にすると、配列・`Vec`・その一部のどれでも受け取れる。
    ```
    fn sum(xs: &[i64]) -> i64 { xs.iter().sum() }
    sum(&[1, 2, 3]);
    sum(&v);
    sum(&v[..2]);
    ```
    範囲外のスライスや添字はパニックする（未定義動作にはならない）。
  questions:
    - q: |-
        C++ でこれに相当するものは？
      a: |-
        `std::span<T>`（C++20）。文字列なら `std::string_view`。ただし C++ ではダングリングを防ぐ仕組みがなく、Rust では借用チェッカーが寿命を検査する。

- id: rust.string-str
  kind: definition
  subject: rust
  title: String と &str
  requires: [rust.slices]
  source: TRPL Ch.8.2
  statement: |-
    - `String` はヒープ上の**所有する**可変長文字列。`&str` は文字列への**借用**（スライス）。文字列リテラル `"abc"` は `&'static str`
    - 中身は常に正しい UTF-8。`len()` は**バイト数**
    - `s[0]` のような整数の添字は使えない（1文字が何バイトか分からないため）。`s.chars()` で文字ごと、`s.bytes()` でバイトごとに回す
    - `&s[a..b]` はバイト位置での切り出しで、文字の境界でなければパニックする
    - 関数の引数は `&str` にすると、`String` も `&str` も渡せる
  questions:
    - q: |-
        `String` を作る方法を3つ挙げよ。
      a: |-
        `String::from("x")`、`"x".to_string()`、`format!("{}{}", a, b)`。`"x".to_owned()` も同じ。

- id: rust.str-index
  kind: code
  subject: rust
  title: 文字境界でないスライス
  requires: [rust.string-str]
  source: TRPL Ch.8.2
  lang: rust
  code: |
    fn main() {
        let s = String::from("日本語");
        println!("{} {}", s.len(), s.chars().count());
        let head = &s[0..1];
        println!("{}", head);
    }
  prompt: |-
    このプログラムはどうなるか？
  answer:
    type: choice
    choices:
      - "3 3 と 日 が出力される"
      - "9 3 と出力された後、パニックする"
      - "9 3 と 日 が出力される"
      - コンパイルエラー
    value: 1
  explanation: |-
    「日本語」は UTF-8 で各3バイト、計 $9$ バイト・$3$ 文字。`&s[0..1]` は1バイト目で切ろうとするが、そこは文字の途中なので実行時にパニックする（byte index 1 is not a char boundary）。
    C/C++ ならマルチバイト文字を壊したまま処理が進むところを、Rust は不正な UTF-8 を作らせない。先頭の1文字が欲しければ `s.chars().next()`。
  verify:
    stdout: "9 3\n"
    panics: true

- id: rust.vec
  kind: definition
  subject: rust
  title: Vec<T>
  requires: [rust.slices]
  source: TRPL Ch.8.1
  statement: |-
    ```
    let mut v: Vec<i32> = Vec::new();
    v.push(3);
    let w = vec![1, 2, 3];
    let x = w[1];              // 範囲外ならパニック
    let y = w.get(10);         // Option<&i32>（範囲外なら None）
    for x in &w { ... }        // 借用して回す（w は後でも使える）
    for x in &mut v { *x += 1; }
    for x in w { ... }         // 所有権ごと消費する（w は以後使えない）
    v.sort(); v.dedup(); v.retain(|&x| x > 0);
    ```
  questions:
    - q: |-
        `for x in w` と `for x in &w` の違いは？
      a: |-
        `for x in w` は `w.into_iter()` で所有権を消費し、`x` は `T`。ループ後 `w` は使えない。`&w` は `w.iter()` で、`x` は `&T`、`w` は残る。

- id: rust.vec-get
  kind: code
  subject: rust
  title: get と添字アクセス
  requires: [rust.vec, rust.option-result]
  source: std ドキュメント "slice::get"
  lang: rust
  code: |
    fn main() {
        let v = vec![10, 20, 30];
        match v.get(5) {
            Some(x) => println!("{}", x),
            None => println!("none"),
        }
        let i = v.len() + 2;
        println!("{}", v[i]);
    }
  prompt: |-
    このプログラムはどうなるか？
  answer:
    type: choice
    choices:
      - "none と出力され、続けて 0 が出力される"
      - "none と出力された後、パニックする"
      - コンパイルエラー
      - 未定義動作
    value: 1
  explanation: |-
    `get` は範囲外なら `None` を返す。`v[i]` は範囲外なのでパニック（index out of bounds）。C++ の `v[i]` と違い、Rust の添字は常に境界検査されるので未定義動作にはならない。
    失敗がありうるなら `get`、ありえないことを表明するなら添字、と使い分ける。
  verify:
    stdout: "none\n"
    panics: true

- id: rust.hashmap
  kind: definition
  subject: rust
  title: HashMap・BTreeMap・HashSet
  requires: [rust.vec, rust.option-result]
  source: TRPL Ch.8.3, std::collections
  statement: |-
    - `HashMap<K, V>` はハッシュ表（順序なし、平均 $O(1)$）。既定のハッシュ関数は乱数の種を使う SipHash で、ハッシュ衝突攻撃に強い
    - `BTreeMap<K, V>` はキーの順序で並ぶ（$O(\log n)$）。`HashSet` / `BTreeSet` は集合
    - `get(&k)` は `Option<&V>`、`insert` は前の値を `Option` で返す
    - **entry API** で「なければ挿入、あれば更新」を1回の探索で書ける
    ```
    *counts.entry(word).or_insert(0) += 1;
    ```
  questions:
    - q: |-
        `HashMap` を回したときの順番を当てにしてはいけない理由は？
      a: |-
        順序は規定されておらず、乱数の種によって実行ごとに変わる。テストが偶然通ったり落ちたりする原因になる。順序が必要なら `BTreeMap` か、`Vec` に集めて並べ替える。

- id: rust.entry
  kind: code
  subject: rust
  title: entry API で数える
  requires: [rust.hashmap]
  source: std ドキュメント "BTreeMap::entry"
  lang: rust
  code: |
    use std::collections::BTreeMap;

    fn main() {
        let text = "b a c a b a";
        let mut counts = BTreeMap::new();
        for w in text.split_whitespace() {
            *counts.entry(w).or_insert(0) += 1;
        }
        println!("{:?}", counts);
    }
  prompt: |-
    出力は何か？
  answer:
    type: choice
    choices:
      - '{"b": 2, "a": 3, "c": 1}'
      - '{"a": 3, "b": 2, "c": 1}'
      - '{"a": 3, "c": 1, "b": 2}'
      - 実行ごとに順番が変わる
    value: 1
  explanation: |-
    `BTreeMap` はキーの順（辞書順）に並ぶので順番が決まる。`or_insert(0)` は値への可変参照を返すので、`*... += 1` で増やせる。`HashMap` にすると表示順は実行ごとに変わりうる。
  verify:
    stdout: "{\"a\": 3, \"b\": 2, \"c\": 1}\n"
