- id: la.eigen
  kind: definition
  subject: linear-algebra
  title: 固有値と固有ベクトル
  requires: [la.null-range]
  source: Axler LADR 4e, Ch.5
  why: |-
    振動の固有振動数、マルコフ連鎖の定常分布、PageRank、主成分分析、反復法の収束速度。「その写像で方向が変わらないベクトル」を見つけると、多くの問題が対角行列の問題に帰着する。
  statement: |-
    線形写像 $T: V \to V$ について、$\lambda \in \mathbb{F}$ が $T$ の**固有値**であるとは、
    $$Tv = \lambda v \quad \text{かつ} \quad v \ne 0$$
    を満たす $v \in V$ が存在すること。このような $v$ を固有値 $\lambda$ の**固有ベクトル**という。
    同値な言い換え: $\operatorname{null}(T - \lambda I) \ne \{0\}$。行列なら $\det(\lambda I - A) = 0$。
  questions:
    - q: |-
        定義で「$v \ne 0$」を外すと何がまずいか？
      a: |-
        $v = 0$ なら任意の $\lambda$ で $T0 = \lambda 0$ が成り立つので、すべての数が固有値になってしまい意味をなさない。
    - q: |-
        $\mathbb{R}^2$ の $90^\circ$ 回転 $\begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix}$ の実固有値は？
      a: |-
        存在しない。特性多項式 $\lambda^2 + 1$ は実数解をもたない（複素数では $\pm i$）。回転で方向が変わらない実ベクトルはない。

- id: la.eigen-independent
  kind: theorem
  subject: linear-algebra
  title: 異なる固有値の固有ベクトルは1次独立
  requires: [la.eigen, la.linear-independence]
  source: Axler LADR 4e, Ch.5
  statement: |-
    $\lambda_1, \dots, \lambda_m$ が $T$ の相異なる固有値で、$v_1, \dots, v_m$ が対応する固有ベクトルならば、$v_1, \dots, v_m$ は1次独立である。
  proof:
    - |-
      背理法。1次従属と仮定し、$v_k \in \operatorname{span}(v_1, \dots, v_{k-1})$ となる最小の $k$ をとる（$v_1, \dots, v_{k-1}$ は1次独立）。
    - |-
      $v_k = a_1 v_1 + \dots + a_{k-1} v_{k-1}$ と書く。
    - |-
      両辺に $T$ をかけると $\lambda_k v_k = a_1 \lambda_1 v_1 + \dots + a_{k-1} \lambda_{k-1} v_{k-1}$。
    - |-
      元の式の $\lambda_k$ 倍を引くと $0 = a_1(\lambda_1 - \lambda_k) v_1 + \dots + a_{k-1}(\lambda_{k-1} - \lambda_k) v_{k-1}$。
    - |-
      $v_1, \dots, v_{k-1}$ の1次独立性と $\lambda_i \ne \lambda_k$ から、すべての $a_i = 0$。
    - |-
      すると $v_k = 0$ となり、固有ベクトルであることに矛盾する。
  questions:
    - q: |-
        「固有値が相異なる」という仮定を外すとどうなるか？反例を挙げよ。
      a: |-
        成り立たない。$T = I$（恒等写像）では $v$ と $2v$ はともに固有値 $1$ の固有ベクトルだが1次従属。
    - q: |-
        この定理から、$n \times n$ 行列の固有値について何が言えるか？
      a: |-
        相異なる固有値は高々 $n$ 個。さらに $n$ 個の相異なる固有値をもてば、固有ベクトルが基底をなすので対角化可能。

