# 線形代数 2: 行列式・固有値・内積

- id: la.det-invertible
  kind: theorem
  subject: linear-algebra
  title: 行列式と可逆性
  requires: [la.rank-nullity]
  source: Axler LADR 4e, Ch.9
  why: |-
    数値計算で「この連立方程式は解けるか」「ヤコビアンが退化していないか」を判定する基本。行列式が 0 に近いと数値的に不安定になる（ただし大きさの目安には条件数を使う）。
  statement: |-
    $A$ を $n \times n$ 行列とするとき、次は同値:

    1. $A$ は可逆
    2. $\det A \ne 0$
    3. $A$ の列ベクトルは1次独立
    4. $Ax = 0$ の解は $x = 0$ のみ
  proof:
    - |-
      (1 ⇒ 2) $AA^{-1} = I$ と積の公式 $\det(AB) = \det A \det B$ から $\det A \cdot \det A^{-1} = 1$。よって $\det A \ne 0$。
    - |-
      (2 ⇒ 3) 対偶を示す。列が1次従属なら、ある列が他の列の線形結合で書ける。
    - |-
      行列式は各列について線形（多重線形）なので、その列を展開すると「同じ列を2本含む行列式」の和になる。
    - |-
      同じ列を2本含む行列式は交代性により $0$。よって $\det A = 0$。
    - |-
      (3 ⇔ 4) $Ax = x_1 a_1 + \dots + x_n a_n$（$a_j$ は列）なので、列の1次独立性は「$Ax = 0 \Rightarrow x = 0$」そのもの。
    - |-
      (4 ⇒ 1) $\operatorname{null} A = \{0\}$ と次元定理から $\dim \operatorname{range} A = n$、つまり全射。単射かつ全射なので可逆。
  questions:
    - q: |-
        $\det(A + B) = \det A + \det B$ は一般に成り立つか？
      a: |-
        成り立たない。例: $A = B = I_2$ なら $\det(2I) = 4$ だが $\det I + \det I = 2$。成り立つのは積 $\det(AB) = \det A \det B$ のほう。
    - q: |-
        $\det(cA)$ を $\det A$ で表せ（$A$ は $n \times n$）。
      a: |-
        $c^n \det A$。各列に $c$ がかかり、多重線形性で $c$ が $n$ 個出てくる。

