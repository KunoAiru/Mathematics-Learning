- id: la.inner-product
  kind: definition
  subject: linear-algebra
  title: 内積とノルム
  requires: [la.vector-space]
  source: Axler LADR 4e, Ch.6
  statement: |-
    実ベクトル空間 $V$ 上の**内積**とは、写像 $\langle \cdot, \cdot \rangle: V \times V \to \mathbb{R}$ で次を満たすもの:

    1. 正値性 $\langle v, v \rangle \ge 0$、かつ $\langle v, v \rangle = 0 \iff v = 0$
    2. 第1引数について線形 $\langle au + bw, v \rangle = a\langle u, v\rangle + b\langle w, v \rangle$
    3. 対称性 $\langle u, v \rangle = \langle v, u \rangle$（複素なら $\overline{\langle v, u \rangle}$）

    **ノルム**は $\|v\| = \sqrt{\langle v, v \rangle}$。$\langle u, v \rangle = 0$ のとき $u, v$ は**直交**するという。
  questions:
    - q: |-
        $\mathbb{R}^2$ 上で $\langle x, y \rangle = x_1 y_1 - x_2 y_2$ は内積か？
      a: |-
        ちがう。$x = (0, 1)$ で $\langle x, x \rangle = -1 < 0$ となり正値性が崩れる（これは相対論のミンコフスキー計量の形）。

- id: la.cauchy-schwarz
  kind: theorem
  subject: linear-algebra
  title: コーシー・シュワルツの不等式
  requires: [la.inner-product]
  source: Axler LADR 4e, Ch.6
  why: |-
    相関係数が $[-1, 1]$ に入る理由、コサイン類似度、三角不等式、確率の $|E[XY]|^2 \le E[X^2]E[Y^2]$ など、あらゆる「上から押さえる」議論の出発点。
  statement: |-
    内積空間の任意の $u, v$ について
    $$|\langle u, v \rangle| \le \|u\|\,\|v\|.$$
    等号は $u, v$ の一方が他方のスカラー倍のときに限る。
  proof:
    - |-
      $v = 0$ なら両辺 $0$ で成り立つ。以下 $v \ne 0$ とする。
    - |-
      $u = \dfrac{\langle u, v \rangle}{\|v\|^2} v + w$ と分解すると、$w = u - \dfrac{\langle u, v \rangle}{\|v\|^2} v$ は $v$ と直交する（内積を計算して確かめる）。
    - |-
      ピタゴラスの定理より $\|u\|^2 = \dfrac{|\langle u, v \rangle|^2}{\|v\|^2} + \|w\|^2 \ge \dfrac{|\langle u, v \rangle|^2}{\|v\|^2}$。
    - |-
      両辺に $\|v\|^2$ をかけて平方根をとれば結論。等号は $w = 0$、つまり $u$ が $v$ のスカラー倍のとき。

- id: la.spectral
  kind: theorem
  subject: linear-algebra
  title: 実対称行列のスペクトル定理
  requires: [la.eigen-independent, la.cauchy-schwarz]
  source: Axler LADR 4e, Ch.7
  why: |-
    共分散行列・ヘッセ行列・グラフラプラシアンはすべて実対称。この定理により「直交する軸に沿って伸び縮みするだけ」と分かり、主成分分析・2次形式の正定値判定・最適化の2階条件の基礎になる。
  statement: |-
    $A \in \mathbb{R}^{n \times n}$ が $A^\top = A$ を満たすならば、直交行列 $Q$（$Q^\top Q = I$）と実対角行列 $\Lambda$ が存在して
    $$A = Q \Lambda Q^\top.$$
    すなわち $A$ の固有値はすべて実数で、固有ベクトルからなる正規直交基底がとれる。
  proof:
    - |-
      特性多項式は $\mathbb{C}$ で根をもつので、$Av = \lambda v$ となる $\lambda \in \mathbb{C}$, $v \in \mathbb{C}^n \setminus \{0\}$ をとる。
    - |-
      $\bar{v}^\top A v$ を2通りに見る。まず $\bar{v}^\top A v = \lambda \bar{v}^\top v = \lambda \|v\|^2$。一方 $A$ は実対称なので $\overline{\bar{v}^\top A v} = v^\top A \bar{v} = (v^\top A \bar{v})^\top = \bar{v}^\top A v$ となり、これは実数。よって $\lambda = \bar{v}^\top A v / \|v\|^2 \in \mathbb{R}$。
    - |-
      $\lambda$ が実数なので $A - \lambda I$ は実行列で、実の固有ベクトル $q_1$（$\|q_1\| = 1$）がとれる。
    - |-
      $W = q_1^\perp$ は $A$ で不変: $w \perp q_1$ なら $\langle Aw, q_1 \rangle = \langle w, A q_1 \rangle = \lambda \langle w, q_1 \rangle = 0$（対称性を使う）。
    - |-
      $A$ を $W$（$n-1$ 次元）に制限したものも対称なので、$n$ に関する帰納法で $W$ の正規直交固有基底 $q_2, \dots, q_n$ がとれる。
    - |-
      $Q = (q_1, \dots, q_n)$ とおけば $AQ = Q\Lambda$、すなわち $A = Q\Lambda Q^\top$。
  questions:
    - q: |-
        対称性の仮定を外すと何が起こるか？反例を挙げよ。
      a: |-
        実固有値すら存在しないことがある。$90^\circ$ 回転 $\begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix}$ の固有値は $\pm i$。また $\begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}$ は固有値 $1$ のみで固有ベクトルが1方向しかなく、対角化できない。
    - q: |-
        対称行列 $A$ が正定値（$x^\top A x > 0$, $x \ne 0$）であることを固有値で言い換えよ。
      a: |-
        すべての固有値が正。$x = Qy$ とおくと $x^\top A x = y^\top \Lambda y = \sum \lambda_i y_i^2$ となるため。
