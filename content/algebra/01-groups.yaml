# 抽象代数学
# 出典の章番号は Judson, Abstract Algebra: Theory and Applications（無料公開）

- id: alg.group
  kind: definition
  subject: algebra
  title: 群
  requires: []
  source: Judson AATA, Ch.3
  why: |-
    「対称性」と「可逆な操作の組み合わせ」の言語。公開鍵暗号（RSA・楕円曲線）、誤り訂正符号、ルービックキューブ、結晶構造、量子計算の基礎。
  statement: |-
    **群**とは集合 $G$ と二項演算 $\cdot : G \times G \to G$ の組で、次を満たすもの:

    1. 結合法則 $(ab)c = a(bc)$
    2. 単位元 $e$ が存在し、すべての $a$ で $ea = ae = a$
    3. 各 $a$ に逆元 $a^{-1}$ が存在し $aa^{-1} = a^{-1}a = e$

    さらに $ab = ba$ が常に成り立つとき**アーベル群**（可換群）という。
  questions:
    - q: |-
        整数全体 $\mathbb{Z}$ は掛け算について群か？
      a: |-
        ちがう。$2$ の逆元 $1/2$ が $\mathbb{Z}$ にない。足し算なら群（単位元 $0$、逆元 $-a$）。
    - q: |-
        可換でない群の例を挙げよ。
      a: |-
        可逆な $2 \times 2$ 実行列全体 $GL_2(\mathbb{R})$（行列の積）。または3文字の置換全体 $S_3$。回転と反転の順序を入れ替えると結果が変わる。

- id: alg.subgroup
  kind: definition
  subject: algebra
  title: 部分群と剰余類
  requires: [alg.group]
  source: Judson AATA, Ch.3, Ch.6
  statement: |-
    群 $G$ の部分集合 $H$ が同じ演算で群になるとき**部分群**といい $H \le G$ と書く。
    $H$ が空でなく、$a, b \in H \Rightarrow ab^{-1} \in H$ ならば部分群である。

    $g \in G$ に対し $gH = \{gh : h \in H\}$ を $H$ の（左）**剰余類**という。
  questions:
    - q: |-
        $G$ の2つの左剰余類 $aH, bH$ は「一致する」か「交わらない」かのどちらかであることを示せ。
      a: |-
        $x \in aH \cap bH$ とすると $x = ah_1 = bh_2$ なので $a = bh_2h_1^{-1} \in bH$。すると $aH \subseteq bH$（$ah = b(h_2h_1^{-1}h)$）、対称に $bH \subseteq aH$。

- id: alg.lagrange
  kind: theorem
  subject: algebra
  title: ラグランジュの定理
  requires: [alg.subgroup]
  source: Judson AATA, Ch.6
  why: |-
    「部分群の大きさは全体の大きさを割り切る」。ここからフェルマーの小定理・オイラーの定理が出てきて、RSA の正しさや素数判定の原理になる。
  statement: |-
    $G$ が有限群で $H \le G$ ならば、$|H|$ は $|G|$ を割り切る。特に、$G$ の各元の位数は $|G|$ を割り切る。
  proof:
    - |-
      左剰余類 $gH$ たちは $G$ を覆う（$g \in gH$）。
    - |-
      2つの左剰余類は一致するか交わらないかのどちらかなので、$G$ は互いに素な剰余類に分割される。
    - |-
      写像 $H \to gH$, $h \mapsto gh$ は全単射（逆写像は $x \mapsto g^{-1}x$）なので、各剰余類の大きさは $|H|$。
    - |-
      剰余類の個数を $k$ とすると $|G| = k\,|H|$。
    - |-
      元 $a$ の位数は、$a$ が生成する巡回部分群 $\langle a \rangle$ の大きさに等しいので、$|G|$ を割り切る。
  questions:
    - q: |-
        逆（$|G|$ の任意の約数 $d$ に対し位数 $d$ の部分群が存在する）は成り立つか？
      a: |-
        成り立たない。交代群 $A_4$ は位数 $12$ だが、位数 $6$ の部分群をもたない。（素数べきについてはシローの定理で存在が保証される。）
    - q: |-
        位数が素数 $p$ の群は必ず巡回群であることを示せ。
      a: |-
        $a \ne e$ をとると $\langle a \rangle$ の位数は $p$ の約数で $1$ でないから $p$。よって $G = \langle a \rangle$。

