- id: alg.fermat
  kind: theorem
  subject: algebra
  title: フェルマーの小定理とオイラーの定理
  requires: [alg.lagrange]
  source: Judson AATA, Ch.6
  statement: |-
    **オイラー**: $\gcd(a, n) = 1$ ならば $a^{\varphi(n)} \equiv 1 \pmod n$。ここで $\varphi(n)$ は $1, \dots, n$ のうち $n$ と互いに素なものの個数。

    **フェルマー**: $p$ が素数で $p \nmid a$ ならば $a^{p-1} \equiv 1 \pmod p$。
  proof:
    - |-
      $n$ と互いに素な剰余類全体 $(\mathbb{Z}/n\mathbb{Z})^\times$ は掛け算で群をなし、その位数は $\varphi(n)$。
    - |-
      $\gcd(a, n) = 1$ なので $a$ はこの群の元。その位数を $k$ とする。
    - |-
      ラグランジュの定理より $k$ は $\varphi(n)$ を割り切るので、$a^{\varphi(n)} = (a^k)^{\varphi(n)/k} \equiv 1$。
    - |-
      $n = p$ が素数なら $\varphi(p) = p - 1$ で、フェルマーの小定理を得る。
  questions:
    - q: |-
        フェルマーの小定理の逆（すべての $\gcd(a, n) = 1$ で $a^{n-1} \equiv 1 \pmod n$ なら $n$ は素数）は成り立つか？
      a: |-
        成り立たない。$561 = 3 \cdot 11 \cdot 17$ はカーマイケル数で、$561$ と互いに素なすべての $a$ で $a^{560} \equiv 1$ となる。だから実用の素数判定はフェルマーテストでなくミラー・ラビン法を使う。

