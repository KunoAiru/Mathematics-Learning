- id: alg.rsa
  kind: theorem
  subject: algebra
  title: RSA 暗号の正しさ
  requires: [alg.fermat]
  source: Judson AATA, Ch.7
  why: |-
    公開鍵暗号の代表例。数学の定理がそのままセキュリティの根拠になっている。どこが壊れると攻撃されるかを知ることが、安全な実装につながる。
  statement: |-
    相異なる素数 $p, q$ に対し $n = pq$、$\varphi(n) = (p-1)(q-1)$ とする。$ed \equiv 1 \pmod{\varphi(n)}$ ならば、$\gcd(m, n) = 1$ を満たす任意の $m$ について
    $$(m^e)^d \equiv m \pmod n.$$
    （実際は $\gcd(m, n) \ne 1$ でも成り立つ。）
  proof:
    - |-
      $ed \equiv 1 \pmod{\varphi(n)}$ より、ある整数 $k \ge 0$ で $ed = 1 + k\varphi(n)$ と書ける。
    - |-
      $(m^e)^d = m^{ed} = m \cdot (m^{\varphi(n)})^k$。
    - |-
      オイラーの定理より $m^{\varphi(n)} \equiv 1 \pmod n$。
    - |-
      よって $m^{ed} \equiv m \cdot 1^k = m \pmod n$。
  questions:
    - q: |-
        $n$ が素因数分解されると RSA が破られるのはなぜか？
      a: |-
        $p, q$ が分かれば $\varphi(n) = (p-1)(q-1)$ が計算でき、拡張ユークリッドの互除法で秘密鍵 $d \equiv e^{-1} \pmod{\varphi(n)}$ が求まる。
    - q: |-
        $e = 3$ で短い平文 $m$（$m^3 < n$）をパディングなしで暗号化すると何がまずいか？
      a: |-
        $c = m^3 \bmod n = m^3$（剰余がかからない）なので、整数の3乗根をとるだけで $m$ が復元できる。実装では OAEP などのパディングが必須。
