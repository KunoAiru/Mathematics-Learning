  requires: [alg.crt]
  generator: alg.crt

- id: alg.field
  kind: theorem
  subject: algebra
  title: 体と Z/nZ が体になる条件
  requires: [alg.ring, alg.bezout]
  source: Judson AATA, Ch.16, Ch.21
  statement: |-
    $0 \ne 1$ で、$0$ 以外のすべての元が掛け算の逆元をもつ可換環を**体**という（$\mathbb{Q}, \mathbb{R}, \mathbb{C}$ など）。
    **定理**: $\mathbb{Z}/n\mathbb{Z}$（$n \ge 2$）が体である $\iff$ $n$ は素数。
  proof:
    - |-
      ($\Leftarrow$) $n = p$ が素数なら、$1 \le a < p$ は $\gcd(a, p) = 1$ を満たす。
    - |-
      ベズーの等式より $ax + py = 1$、つまり $ax \equiv 1 \pmod p$。よって $0$ 以外の元はすべて逆元をもち、体。
    - |-
      ($\Rightarrow$) $n$ が合成数 $n = ab$（$1 < a, b < n$）なら、$a \cdot b \equiv 0 \pmod n$ で $a$ は零因子。
    - |-
      零因子は逆元をもたない（$a^{-1}$ があれば $b = a^{-1}ab = 0$ となり矛盾）。よって体でない。
  questions:
    - q: |-
        暗号で「素数 $p$ を法とする」計算がよく使われる理由を、この定理から説明せよ。
      a: |-
        $\mathbb{Z}/p\mathbb{Z}$ は体なので、$0$ 以外では割り算がいつでもでき、多項式の根が次数個以下などの「体の性質」が使える。楕円曲線暗号や秘密分散（シャミア）はこれを前提にしている。

- id: alg.poly-ring
  kind: definition
  subject: algebra
  title: 多項式環と剰余の定理
  requires: [alg.field]
  source: Judson AATA, Ch.17
  statement: |-
    体 $F$ 上の多項式全体 $F[x]$ は環で、整数と同じように**割り算**ができる: $g \ne 0$ に対し $f = qg + r$（$\deg r < \deg g$）となる $q, r$ がただ1つある。
    - $f(a) = 0 \iff (x - a) \mid f$（因数定理）
    - 次数 $d$ の $0$ でない多項式の根は、体の中で**高々 $d$ 個**
    - 既約多項式（定数でない多項式の積に分解できないもの）は、整数での素数に当たる
  questions:
    - q: |-
        「次数 $d$ の多項式の根は高々 $d$ 個」が体でない環で成り立たない例を挙げよ。
      a: |-
        $\mathbb{Z}/8\mathbb{Z}$ で $x^2 - 1$ は $x = 1, 3, 5, 7$ の4個の根をもつ。零因子があると $(x - a)(x - b) = 0$ から $x = a$ または $x = b$ を導けない。
    - q: |-
        シャミアの秘密分散で、$k$ 個の点から次数 $k - 1$ の多項式が一意に決まるのはなぜか？
      a: |-
        同じ $k$ 点を通る次数 $k - 1$ 以下の多項式が2つあれば、その差は次数 $k - 1$ 以下で $k$ 個の根をもつので $0$。体の上で考えているから成り立つ。

- id: alg.sqrt-mod
  kind: problem
  subject: algebra
  title: 合同式の平方根（計算）
  requires: [alg.poly-ring]
  generator: alg.sqrt-mod

- id: alg.finite-field
  kind: definition
  subject: algebra
  title: 有限体
  requires: [alg.poly-ring, alg.cyclic]
  source: Judson AATA, Ch.22
  why: |-
    AES、リード・ソロモン符号（QR コード・CD）、楕円曲線暗号、CRC はすべて有限体の上の計算。ビット演算で効率よく実装できる。
  statement: |-
    - 有限体の位数は素数べき $p^n$ で、各 $p^n$ に対し同型を除いてただ1つ存在する（$\mathbb{F}_{p^n}$ または $GF(p^n)$ と書く）
    - $\mathbb{F}_{p^n} \cong \mathbb{F}_p[x] / (f)$（$f$ は次数 $n$ の既約多項式）。元は次数 $n$ 未満の多項式で、掛け算は $f$ で割った余り
    - 乗法群 $\mathbb{F}_{p^n}^\times$ は位数 $p^n - 1$ の**巡回群**
    例: AES は $\mathbb{F}_{2^8} = \mathbb{F}_2[x]/(x^8 + x^4 + x^3 + x + 1)$ を使う。1バイトが1つの元で、足し算は XOR。
  questions:
    - q: |-
        $\mathbb{F}_4$ と $\mathbb{Z}/4\mathbb{Z}$ は同じか？
      a: |-
        ちがう。$\mathbb{Z}/4\mathbb{Z}$ は $2 \cdot 2 = 0$ で体でない。$\mathbb{F}_4 = \mathbb{F}_2[x]/(x^2 + x + 1)$ は元 $0, 1, x, x + 1$ からなる体で、標数は $2$（$1 + 1 = 0$）。

- id: alg.dlog
  kind: definition
  subject: algebra
  title: 離散対数問題と Diffie–Hellman 鍵共有
  requires: [alg.cyclic, alg.fermat]
  source: Judson AATA, Ch.7
  why: |-
    TLS などで使われる鍵共有の安全性の根拠。どの群のどんな部分群を使うかを間違えると、安全性が大きく下がる。
  statement: |-
    巡回群 $G = \langle g \rangle$（位数 $q$）で、$h = g^x$ から $x$ を求める問題を**離散対数問題**という。$g^x$ の計算は繰り返し二乗法で速いが、逆は（適切な群では）効率的な方法が知られていない。
    **Diffie–Hellman 鍵共有**: Alice は秘密の $a$ を選んで $g^a$ を、Bob は秘密の $b$ を選んで $g^b$ を公開する。双方が $(g^b)^a = (g^a)^b = g^{ab}$ を共有鍵にする。盗聴者は $g^a, g^b$ から $g^{ab}$ を計算できないと考えられている。
  questions:
    - q: |-
        Diffie–Hellman を認証なしで使うと、どんな攻撃が可能か？
      a: |-
        中間者攻撃。攻撃者が間に入り、Alice とも Bob とも別々に鍵共有すれば、すべての通信を読み書きできる。公開値に署名するなどの認証が必要。
    - q: |-
        量子コンピュータは離散対数問題にどう影響するか？
      a: |-
        ショアのアルゴリズムで離散対数も素因数分解も多項式時間で解ける。そのため格子暗号などの耐量子暗号への移行が進んでいる。
