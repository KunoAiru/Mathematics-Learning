- id: stat.t-test
  kind: definition
  subject: statistics
  title: t 検定
  requires: [stat.p-value, stat.sample-variance]
  source: OpenIntro Statistics 4e, Ch.7.1–7.3
  statement: |-
    母分散が未知のとき、$\sigma$ を標本標準偏差 $S$ で置き換えた
    $$T = \frac{\bar{X} - \mu_0}{S/\sqrt{n}}$$
    は、正規母集団なら $H_0$ のもとで**自由度 $n - 1$ の t 分布**に従う。t 分布は正規分布より裾が重く、$n$ が大きいと正規分布に近づく。
    - 対応のある2群（同じ人の前後など）は差をとって1標本の t 検定
    - 独立な2群は2標本の t 検定（分散が等しいと仮定しない Welch の方法が既定として安全）
  questions:
    - q: |-
        $n$ が小さいときに z 検定（$\sigma$ に $S$ を代入して正規分布で判定）を使うと何が起こるか？
      a: |-
        $S$ のばらつきを無視しているので棄却域が狭すぎ、第1種の誤りの確率が名目の $\alpha$ より大きくなる。

- id: stat.multiple-testing
  kind: theorem
  subject: statistics
  title: 多重検定とボンフェローニ補正
  requires: [stat.p-value, prob.space]
  source: OpenIntro Statistics 4e, Ch.7.5
  why: |-
    20個の指標を有意水準5%で調べれば、効果がなくても平均1個は「有意」になる。A/B テストや遺伝子解析、論文の再現性問題（p ハッキング）の根本。
  statement: |-
    $m$ 個の検定をそれぞれ有意水準 $\alpha/m$ で行うと、帰無仮説がすべて真であっても**少なくとも1つを誤って棄却する確率**（ファミリーワイズエラー率）は $\alpha$ 以下になる。
  proof:
    - |-
      $A_i$ を「$i$ 番目の検定で（真の）帰無仮説を誤って棄却する」事象とする。各検定は水準 $\alpha/m$ なので $P(A_i) \le \alpha/m$。
    - |-
      少なくとも1つ誤る確率は $P(A_1 \cup \dots \cup A_m)$。
    - |-
      和集合上界（ユニオンバウンド）より $P\left(\bigcup_i A_i\right) \le \sum_i P(A_i) \le m \cdot \frac{\alpha}{m} = \alpha$。検定どうしの独立性は不要。
  questions:
    - q: |-
        ボンフェローニ補正の欠点は？
      a: |-
        保守的すぎて検出力が大きく落ちる。多数の検定では、誤って棄却したものの「割合」を抑える偽発見率（FDR）の制御（Benjamini–Hochberg 法）がよく使われる。

- id: stat.bayes-inference
  kind: definition
  subject: statistics
  title: ベイズ推定と共役事前分布
  requires: [prob.bayes, stat.mle]
  source: Grinstead & Snell, Ch.4（ベイズの定理）, 数理統計の標準的な内容
  statement: |-
    パラメータ $\theta$ を確率変数とみなし、**事前分布** $p(\theta)$ をデータで更新して**事後分布**を得る:
    $$p(\theta \mid x) = \frac{p(x \mid \theta)\,p(\theta)}{p(x)} \propto p(x \mid \theta)\,p(\theta).$$
    事後分布が事前分布と同じ形になる組を**共役**という。例: 二項分布の成功確率に $\mathrm{Beta}(\alpha, \beta)$ 事前分布 → $k$ 回成功・$n - k$ 回失敗を見たら事後分布は $\mathrm{Beta}(\alpha + k, \beta + n - k)$。
    事後分布から作る**信用区間**は「$\theta$ がこの区間に入る確率が 95%」と直接解釈できる（信頼区間とは意味が違う）。
  questions:
    - q: |-
        データが非常に多いとき、ベイズ推定と最尤推定の結果はどうなるか？
      a: |-
        尤度が事前分布を圧倒し、事後分布は最尤推定値のまわりに集中する。事前分布が効くのはデータが少ないとき（ゼロ頻度問題の回避など）。

