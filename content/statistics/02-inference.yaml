- id: stat.bootstrap
  kind: definition
  subject: statistics
  title: ブートストラップ法
  requires: [stat.confidence-interval]
  source: OpenIntro Statistics 4e（関連 Ch.5）, 統計学の標準的な手法
  statement: |-
    手元のデータ $x_1, \dots, x_n$ から**重複を許して** $n$ 個を選び直す（リサンプリング）ことを何千回も繰り返し、そのたびに推定量（中央値、相関係数など）を計算する。その値のばらつきで、推定量の標準誤差や信頼区間を見積もる。
    数式で分布を導けない推定量にも使える。プログラムで数行で書ける。
  questions:
    - q: |-
        ブートストラップがうまくいかない例を挙げよ。
      a: |-
        標本の最大値（母集団の上限の推定）、データが少なすぎる場合、データが独立でない場合（時系列はブロックごとにリサンプリングする必要がある）。

- id: stat.correlation
  kind: definition
  subject: statistics
  title: 共分散と相関係数
  requires: [prob.variance, la.cauchy-schwarz]
  source: OpenIntro Statistics 4e, Ch.8.1
  statement: |-
    $\operatorname{Cov}(X, Y) = E[(X - \mu_X)(Y - \mu_Y)]$、**相関係数** $\rho = \dfrac{\operatorname{Cov}(X, Y)}{\sigma_X\sigma_Y}$。
    - コーシー・シュワルツの不等式より $-1 \le \rho \le 1$。$|\rho| = 1$ はデータが完全に一直線上にあるとき
    - $\rho$ は**直線的な**関係の強さだけを測る
    - 独立なら $\rho = 0$ だが、逆は成り立たない
  questions:
    - q: |-
        $\rho = 0$ だが独立でない例を挙げよ。
      a: |-
        $X$ が $-1, 0, 1$ を等確率でとり $Y = X^2$。$Y$ は $X$ で完全に決まるが、$\operatorname{Cov}(X, Y) = E[X^3] - E[X]E[X^2] = 0$。
    - q: |-
        「アイスの売上と水難事故に強い相関がある」から何が言えるか？
      a: |-
        因果関係は言えない。気温という共通の原因（交絡因子）が両方を増やしているだけかもしれない。

