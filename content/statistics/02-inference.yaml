# 統計学 2: 推定・検定・ベイズ・回帰
# 出典: OpenIntro Statistics 4th ed.（無料公開）, Grinstead & Snell

- id: stat.mle
  kind: definition
  subject: statistics
  title: 最尤推定
  requires: [stat.unbiased, prob.expectation]
  source: OpenIntro Statistics 4e（関連 Ch.5）, 数理統計の標準的な内容
  why: |-
    実験データから物理定数や故障率を推定する、機械学習で損失関数を決める（二乗誤差・交差エントロピーは最尤推定から出てくる）など、モデルとデータをつなぐ最も基本的な方法。
  statement: |-
    独立なデータ $x_1, \dots, x_n$ がパラメータ $\theta$ の確率分布 $p(x \mid \theta)$ に従うとき、**尤度**を
    $$L(\theta) = \prod_{i=1}^n p(x_i \mid \theta)$$
    とし、これを最大にする $\hat\theta$ を**最尤推定量**という。計算では対数尤度 $\ell(\theta) = \sum_i \log p(x_i \mid \theta)$ を最大化する（積が和になり、数値的にも安定）。
    性質: 標本が大きいと真の値に近づき（一致性）、近似的に正規分布に従う。$g(\theta)$ の最尤推定量は $g(\hat\theta)$（不変性）。
  questions:
    - q: |-
        正規分布 $N(\mu, \sigma^2)$（$\sigma$ 既知）で $\mu$ の最尤推定を考えると、最小二乗法とどう関係するか？
      a: |-
        $\ell(\mu) = -\frac{1}{2\sigma^2}\sum(x_i - \mu)^2 + \text{const}$ なので、最尤推定は二乗誤差の最小化と同じ。回帰でも、誤差が正規分布なら最小二乗法 = 最尤推定。
    - q: |-
        尤度 $L(\theta)$ は $\theta$ の確率分布か？
      a: |-
        ちがう。データを固定して $\theta$ の関数とみたもので、$\theta$ について積分しても $1$ になるとは限らない。$\theta$ の分布を考えるのはベイズ推定。

