- id: stat.overfitting
  kind: definition
  subject: statistics
  title: 過学習と交差検証
  requires: [stat.least-squares, stat.unbiased]
  source: OpenIntro Statistics 4e, Ch.9
  why: |-
    実験データに複雑なモデルを当てはめると、手元のデータには合うが新しいデータでは外れる。研究結果の信頼性を左右する、最も実践的な統計の知識の一つ。
  statement: |-
    - モデルを複雑にすると訓練データへの誤差は必ず減るが、新しいデータへの誤差（汎化誤差）はある所から増える（**過学習**）
    - 予測誤差 ≈ バイアス² + 分散 + ノイズ。単純なモデルはバイアスが大きく、複雑なモデルは分散が大きい
    - 汎化誤差はモデル選択に使っていないデータで測る。**$k$ 分割交差検証**: データを $k$ 個に分け、1つで評価・残りで学習を $k$ 回繰り返して平均する
    - 正則化（リッジ $\lambda\|w\|^2$、LASSO $\lambda\|w\|_1$）で複雑さを抑える
  questions:
    - q: |-
        データ $n$ 点に $n - 1$ 次の多項式を当てはめると何が起こるか？
      a: |-
        すべての点を正確に通り訓練誤差は $0$ になるが、点の間で大きく振動し、新しい点の予測はひどく外れる（ルンゲ現象に似た振る舞い）。
    - q: |-
        テストデータの結果を見てハイパーパラメータを調整し直すと何がまずいか？
      a: |-
        テストデータの情報がモデル選択に漏れ、テスト誤差が楽観的になる。調整は検証データか交差検証で行い、テストデータは最後に1回だけ使う。

- id: stat.causation
  kind: definition
  subject: statistics
  title: 交絡とシンプソンのパラドックス
  requires: [stat.correlation]
  source: OpenIntro Statistics 4e, Ch.1.3–1.4
  statement: |-
    観察データの相関は因果を意味しない。原因と結果の両方に影響する**交絡因子**があると、見かけの関係が生じたり、逆転したりする。
    **シンプソンのパラドックス**: グループごとに見るとどのグループでも A が B より良いのに、全体をまとめると B のほうが良く見えることがある（グループの大きさの偏りのため）。
    因果を調べる最も確実な方法は**無作為化比較試験**（処置をランダムに割り当てると、交絡因子が平均的に釣り合う）。
  questions:
    - q: |-
        シンプソンのパラドックスの例を作れ。
      a: |-
        腎結石の治療の有名なデータ（Charig ら, 1986）: 治療 A は小さい結石で $81/87 \approx 93\%$、大きい結石で $192/263 \approx 73\%$ 成功。治療 B は小さい結石で $234/270 \approx 87\%$、大きい結石で $55/80 \approx 69\%$。どちらでも A が上だが、合計すると A は $273/350 = 78\%$、B は $289/350 \approx 83\%$ で B が上に見える。A が難しい大きな結石に多く使われたため（結石の大きさが交絡因子）。
