- id: stat.mle-normal
  kind: theorem
  subject: statistics
  title: 正規分布の最尤推定
  requires: [stat.mle, stat.sample-variance]
  source: 数理統計の標準的な内容
  statement: |-
    $X_1, \dots, X_n$ が独立に $N(\mu, \sigma^2)$ に従うとき、$(\mu, \sigma^2)$ の最尤推定量は
    $$\hat\mu = \bar{X}, \qquad \hat\sigma^2 = \frac1n\sum_{i=1}^n (X_i - \bar{X})^2.$$
    $\hat\sigma^2$ は $n$ で割るので**不偏ではない**（$E[\hat\sigma^2] = \frac{n-1}{n}\sigma^2$）。
  proof:
    - |-
      対数尤度は $\ell(\mu, \sigma^2) = -\frac n2\log(2\pi\sigma^2) - \frac{1}{2\sigma^2}\sum_i (x_i - \mu)^2$。
    - |-
      $\mu$ で偏微分して $0$: $\frac{1}{\sigma^2}\sum_i (x_i - \mu) = 0$ より $\hat\mu = \bar{x}$。
    - |-
      $\sigma^2$ で偏微分して $0$: $-\frac{n}{2\sigma^2} + \frac{1}{2\sigma^4}\sum_i (x_i - \hat\mu)^2 = 0$ より $\hat\sigma^2 = \frac1n\sum_i (x_i - \bar{x})^2$。
    - |-
      標本分散の不偏性の定理より $E\left[\sum (X_i - \bar X)^2\right] = (n-1)\sigma^2$ なので $E[\hat\sigma^2] = \frac{n-1}{n}\sigma^2$。
  questions:
    - q: |-
        最尤推定量が不偏でないことは問題か？
      a: |-
        $n$ が大きければ偏りは $O(1/n)$ で消える。平均二乗誤差では $n$ で割るほうが $n - 1$ で割るより小さいこともある。不偏性は推定量の良さの一つの基準にすぎない。

- id: stat.hypothesis-test
  kind: definition
  subject: statistics
  title: 仮説検定の枠組み
  requires: [stat.confidence-interval]
  source: OpenIntro Statistics 4e, Ch.5.3
  statement: |-
    1. **帰無仮説** $H_0$（例: 効果なし）と**対立仮説** $H_1$ を立てる
    2. $H_0$ のもとで分布が分かる**検定統計量**を決める
    3. **有意水準** $\alpha$（例: $0.05$）を決め、$H_0$ のもとで確率 $\alpha$ でしか起きない「極端な値」の領域を棄却域とする
    4. データから統計量を計算し、棄却域に入れば $H_0$ を棄却する

    誤りには2種類ある:
    - **第1種の誤り**: $H_0$ が真なのに棄却する（確率 $\alpha$）
    - **第2種の誤り**: $H_1$ が真なのに棄却しない（確率 $\beta$）。$1 - \beta$ を**検出力**という
  questions:
    - q: |-
        「$H_0$ を棄却できなかった」ことは「$H_0$ が正しい」ことを示すか？
      a: |-
        示さない。標本が小さく検出力が低いだけかもしれない。「証拠が不十分だった」としか言えない。
    - q: |-
        侵入検知システムの「誤検知」と「見逃し」は、それぞれ第何種の誤りか？（$H_0$: 正常な通信）
      a: |-
        誤検知（正常なのに警報）が第1種、見逃し（攻撃なのに警報なし）が第2種。閾値を動かすと一方が減ると他方が増えるトレードオフがある。

- id: stat.p-value
  kind: definition
  subject: statistics
  title: p 値
  requires: [stat.hypothesis-test]
  source: OpenIntro Statistics 4e, Ch.5.3
  statement: |-
    **p 値**とは、$H_0$ が正しいと仮定したときに、実際に観測した値と**同じかそれ以上に極端な**統計量が得られる確率。
    $p \le \alpha$ なら有意水準 $\alpha$ で $H_0$ を棄却する。
    よくある誤解:
    - p 値は「$H_0$ が正しい確率」ではない
    - p 値は効果の大きさを表さない（標本が大きければ、ごく小さな差でも p 値は小さくなる）
    - $p = 0.049$ と $p = 0.051$ に本質的な違いはない
  questions:
    - q: |-
        「新薬の効果の検定で $p = 0.01$」から言えることと言えないことは？
      a: |-
        言えること: 効果がないとすると、これほど極端な結果は1%の確率でしか起きない。言えないこと: 薬が効く確率が99%、効果が大きい、臨床的に意味がある。効果の大きさは信頼区間で示す。

