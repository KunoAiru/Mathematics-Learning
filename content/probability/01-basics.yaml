- id: prob.variance
  kind: definition
  subject: probability
  title: 分散
  requires: [prob.linearity]
  source: Grinstead & Snell, Ch.6
  statement: |-
    $\mu = E[X]$ とするとき、$X$ の**分散**は
    $$\operatorname{Var}(X) = E[(X - \mu)^2] = E[X^2] - \mu^2.$$
    $X, Y$ が独立なら $\operatorname{Var}(X + Y) = \operatorname{Var}(X) + \operatorname{Var}(Y)$。
  questions:
    - q: |-
        $E[(X - \mu)^2] = E[X^2] - \mu^2$ を示せ。
      a: |-
        展開して線形性: $E[X^2 - 2\mu X + \mu^2] = E[X^2] - 2\mu E[X] + \mu^2 = E[X^2] - \mu^2$。
    - q: |-
        $\operatorname{Var}(aX + b)$ は？
      a: |-
        $a^2 \operatorname{Var}(X)$。定数のずれ $b$ は分散に影響せず、倍率は2乗で効く。

