- id: prob.expectation
  kind: definition
  subject: probability
  title: 確率変数と期待値
  requires: [prob.space]
  source: Grinstead & Snell, Ch.6
  statement: |-
    **確率変数**とは関数 $X: \Omega \to \mathbb{R}$。離散確率変数 $X$ の**期待値**は
    $$E[X] = \sum_x x\, P(X = x)$$
    （右辺が絶対収束するとき）。連続なら密度 $f$ を使って $E[X] = \int x f(x)\,dx$。
  questions:
    - q: |-
        $E[X]$ が存在しない例を挙げよ。
      a: |-
        $P(X = 2^k) = 2^{-k}$（$k = 1, 2, \dots$）なら $\sum 2^k \cdot 2^{-k} = \sum 1 = \infty$（サンクトペテルブルクのパラドックス）。連続ならコーシー分布。

- id: prob.linearity
  kind: theorem
  subject: probability
  title: 期待値の線形性
  requires: [prob.expectation]
  source: Grinstead & Snell, Ch.6
  why: |-
    依存関係が複雑でも期待値だけは足し算で計算できる。指示変数と組み合わせると、ハッシュの衝突数・乱択アルゴリズムの計算量・テストで見つかるバグ数の見積もりが一行で出る。
  statement: |-
    $E[X], E[Y]$ が存在すれば、任意の定数 $a, b$ について
    $$E[aX + bY] = aE[X] + bE[Y].$$
    **独立性は不要**である。
  proof:
    - |-
      離散の場合を示す。同時分布 $p(x, y) = P(X = x, Y = y)$ を使うと $E[X + Y] = \sum_{x, y} (x + y) p(x, y)$。
    - |-
      和を分けて $\sum_{x, y} x\, p(x, y) + \sum_{x, y} y\, p(x, y)$。
    - |-
      $\sum_y p(x, y) = P(X = x)$（周辺化）より、第1項は $\sum_x x P(X = x) = E[X]$、第2項は $E[Y]$。
    - |-
      定数倍 $E[aX] = aE[X]$ は定義から直ちに従う。
  questions:
    - q: |-
        $E[XY] = E[X]E[Y]$ は常に成り立つか？
      a: |-
        成り立たない（独立なら成り立つ）。反例: $X$ が $\pm 1$ を確率 $1/2$ ずつとり $Y = X$ なら $E[XY] = E[X^2] = 1$ だが $E[X]E[Y] = 0$。
    - q: |-
        $n$ 人の帽子をランダムに配り直したとき、自分の帽子が戻る人数の期待値は？
      a: |-
        $1$。指示変数 $I_i$ =「$i$ が自分の帽子を受け取る」とすると $E[I_i] = 1/n$。線形性で $n \cdot 1/n = 1$（$I_i$ どうしは独立でないが関係ない）。

