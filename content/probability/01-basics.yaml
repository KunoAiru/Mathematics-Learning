# 確率論
# 出典の章番号は Grinstead & Snell, Introduction to Probability（無料公開）

- id: prob.space
  kind: definition
  subject: probability
  title: 確率空間
  requires: []
  source: Grinstead & Snell, Ch.1–2
  why: |-
    「確率」を曖昧な直感でなく、集合と関数で書ける対象にする。乱択アルゴリズムの解析やセキュリティの攻撃成功確率の評価は、すべてこの上で行う。
  statement: |-
    **確率空間**とは組 $(\Omega, \mathcal{F}, P)$ で、$\Omega$ は標本空間（起こりうる結果全体）、$\mathcal{F}$ は事象（$\Omega$ の部分集合）の族、$P: \mathcal{F} \to [0, 1]$ は次を満たす関数:

    1. $P(\Omega) = 1$
    2. 互いに素な事象 $A_1, A_2, \dots$ について $P\left(\bigcup_i A_i\right) = \sum_i P(A_i)$（可算加法性）

    ここから $P(A^c) = 1 - P(A)$, $P(A \cup B) = P(A) + P(B) - P(A \cap B)$ などが導かれる。
  questions:
    - q: |-
        $P(A \cup B) \le P(A) + P(B)$（和集合上界）を公理から示せ。
      a: |-
        $P(A \cup B) = P(A) + P(B) - P(A \cap B)$ で、$P(A \cap B) \ge 0$ だから。多数の「悪い事象」のどれかが起きる確率を、それぞれの確率の和で押さえるのに使う（ユニオンバウンド）。

- id: prob.conditional
  kind: definition
  subject: probability
  title: 条件付き確率と独立性
  requires: [prob.space]
  source: Grinstead & Snell, Ch.4
  statement: |-
    $P(B) > 0$ のとき、$B$ のもとでの $A$ の**条件付き確率**を
    $$P(A \mid B) = \frac{P(A \cap B)}{P(B)}$$
    と定める。事象 $A, B$ が**独立**であるとは $P(A \cap B) = P(A)P(B)$ が成り立つこと。
  questions:
    - q: |-
        「互いに素（排反）」と「独立」は同じか？
      a: |-
        ちがう。$P(A), P(B) > 0$ で排反なら $P(A \cap B) = 0 \ne P(A)P(B)$ なので、むしろ独立ではない（一方が起きればもう一方は起きないと分かる）。
    - q: |-
        $A, B, C$ が2つずつ独立なら3つ組として独立（$P(A \cap B \cap C) = P(A)P(B)P(C)$）か？
      a: |-
        一般には成り立たない。公平なコインを2回投げ、$A$ = 1回目が表、$B$ = 2回目が表、$C$ = 2回の結果が一致。どの2つも独立だが $P(A \cap B \cap C) = 1/4 \ne 1/8$。

- id: prob.bayes
  kind: theorem
  subject: probability
  title: ベイズの定理
  requires: [prob.conditional]
  source: Grinstead & Snell, Ch.4
  why: |-
    観測から原因を推定する式。スパムフィルタ、故障診断、侵入検知の誤報率の見積もり、ベイズ推定の基礎。
  statement: |-
    $B_1, \dots, B_n$ が $\Omega$ の分割（互いに素で和集合が $\Omega$）で $P(B_i) > 0$、$P(A) > 0$ ならば
    $$P(B_j \mid A) = \frac{P(A \mid B_j)\,P(B_j)}{\sum_{i=1}^n P(A \mid B_i)\,P(B_i)}.$$
  proof:
    - |-
      条件付き確率の定義から $P(A \cap B_j) = P(A \mid B_j) P(B_j)$。
    - |-
      同じく定義から $P(B_j \mid A) = P(A \cap B_j) / P(A)$。
    - |-
      $A = \bigcup_i (A \cap B_i)$ は互いに素な和なので $P(A) = \sum_i P(A \cap B_i) = \sum_i P(A \mid B_i) P(B_i)$（全確率の公式）。
    - |-
      これらを代入して結論を得る。
  questions:
    - q: |-
        $P(A \mid B)$ と $P(B \mid A)$ を取り違えるとどんな誤りになるか？例を挙げよ。
      a: |-
        「病気なら 99% 陽性」から「陽性なら 99% 病気」と結論する誤り（検察官の誤謬）。有病率が 0.1% なら、偽陽性率 1% でも陽性者のうち本当に病気なのは約 9% にすぎない。

