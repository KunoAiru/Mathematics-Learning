- id: prob.markov-chebyshev
  kind: theorem
  subject: probability
  title: マルコフの不等式・チェビシェフの不等式
  requires: [prob.variance]
  source: Grinstead & Snell, Ch.8
  why: |-
    分布の形が分からなくても、平均と分散だけで「外れ値になる確率」を上から押さえられる。アルゴリズムの「高確率で速い」の証明や、計測値の信頼性評価に使う。
  statement: |-
    **マルコフ**: $X \ge 0$, $a > 0$ ならば $P(X \ge a) \le \dfrac{E[X]}{a}$。

    **チェビシェフ**: $\mu = E[X]$, $\sigma^2 = \operatorname{Var}(X) < \infty$ ならば、任意の $\varepsilon > 0$ で
    $$P(|X - \mu| \ge \varepsilon) \le \frac{\sigma^2}{\varepsilon^2}.$$
  proof:
    - |-
      $X \ge 0$ なので、各点で $X \ge a \cdot \mathbf{1}\{X \ge a\}$ が成り立つ。
    - |-
      両辺の期待値をとると $E[X] \ge a\, P(X \ge a)$。$a$ で割ればマルコフの不等式。
    - |-
      チェビシェフは $Y = (X - \mu)^2 \ge 0$ にマルコフを適用する: $P(Y \ge \varepsilon^2) \le E[Y]/\varepsilon^2 = \sigma^2/\varepsilon^2$。
    - |-
      $\{Y \ge \varepsilon^2\} = \{|X - \mu| \ge \varepsilon\}$ なので結論を得る。
  questions:
    - q: |-
        マルコフの不等式で $X \ge 0$ の仮定を外すと何が起こるか？反例を挙げよ。
      a: |-
        成り立たない。$X$ が $-100$ と $1$ を確率 $1/2$ ずつとると $E[X] = -49.5$、$a = 1$ で $P(X \ge 1) = 1/2 > -49.5$。
    - q: |-
        「平均から $3\sigma$ 以上離れる確率」をチェビシェフで押さえよ。正規分布の場合と比べると？
      a: |-
        $\le 1/9 \approx 0.111$。正規分布なら約 $0.0027$。チェビシェフはどんな分布でも成り立つ代わりに粗い。

- id: prob.wlln
  kind: theorem
  subject: probability
  title: 大数の弱法則
  requires: [prob.markov-chebyshev]
  source: Grinstead & Snell, Ch.8
  statement: |-
    $X_1, X_2, \dots$ が独立同分布で $E[X_i] = \mu$, $\operatorname{Var}(X_i) = \sigma^2 < \infty$ とする。$\bar{X}_n = \frac{1}{n}\sum_{i=1}^n X_i$ とおくと、任意の $\varepsilon > 0$ で
    $$P(|\bar{X}_n - \mu| \ge \varepsilon) \to 0 \quad (n \to \infty).$$
  proof:
    - |-
      線形性より $E[\bar{X}_n] = \mu$。
    - |-
      独立性より分散は足せるので $\operatorname{Var}(\bar{X}_n) = \frac{1}{n^2} \cdot n\sigma^2 = \frac{\sigma^2}{n}$。
    - |-
      チェビシェフの不等式より $P(|\bar{X}_n - \mu| \ge \varepsilon) \le \dfrac{\sigma^2}{n \varepsilon^2}$。
    - |-
      右辺は $n \to \infty$ で $0$ に収束する。
  questions:
    - q: |-
        独立性の仮定を外すと何が起こるか？反例を挙げよ。
      a: |-
        成り立たない。すべての $i$ で $X_i = X_1$（同じ値のコピー）なら $\bar{X}_n = X_1$ のままで、$X_1$ が定数でない限り $\mu$ に収束しない。
    - q: |-
        モンテカルロ法で誤差を半分にするには、サンプル数を何倍にすればよいか？
      a: |-
        4倍。標準偏差は $\sigma/\sqrt{n}$ なので、誤差は $1/\sqrt{n}$ でしか減らない。

- id: prob.clt
  kind: theorem
  subject: probability
  title: 中心極限定理
  requires: [prob.wlln]
  source: Grinstead & Snell, Ch.9
  why: |-
    多くの小さな独立な誤差の和はほぼ正規分布になる。信頼区間・検定・測定誤差の扱いがこれに支えられている。
  statement: |-
    $X_1, X_2, \dots$ が独立同分布で $E[X_i] = \mu$, $0 < \operatorname{Var}(X_i) = \sigma^2 < \infty$ ならば、$S_n = X_1 + \dots + X_n$ について
    $$P\left(\frac{S_n - n\mu}{\sigma\sqrt{n}} \le x\right) \to \Phi(x) \quad (n \to \infty)$$
    が任意の $x$ で成り立つ。$\Phi$ は標準正規分布の分布関数。
  questions:
    - q: |-
        分散が有限という仮定を外すと何が起こるか？例を挙げよ。
      a: |-
        成り立たないことがある。独立同分布の標準コーシー分布の標本平均は、何個平均しても標準コーシー分布のままで、正規分布に近づかない（大数の法則すら成り立たない）。
    - q: |-
        サイコロを100回振った目の和は、およそどの範囲に95%の確率で入るか？
      a: |-
        $\mu = 3.5$, $\sigma^2 = 35/12$。和の平均 $350$、標準偏差 $\sqrt{100 \cdot 35/12} \approx 17.1$。およそ $350 \pm 1.96 \times 17.1 \approx [316, 384]$。

